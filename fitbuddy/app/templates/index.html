<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy – AI Workout Generator</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="wrap">
  <nav><a class="btn ghost" href="/view-all-users">View all users</a></nav>
  <h1>FitBuddy</h1>
  <p class="sub">Tell us about you and get a 7-day workout plan with a nutrition tip, built by Gemini.</p>
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  <form class="panel" action="/generate-workout" method="post">
    <div class="grid">
      <div class="field"><label for="username">Name</label><input id="username" name="username" required maxlength="80"></div>
      <div class="field"><label for="user_id">User ID</label><input id="user_id" name="user_id" required maxlength="40" placeholder="e.g. alex01"></div>
      <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="10" max="100" required></div>
      <div class="field"><label for="weight">Weight (kg)</label><input id="weight" name="weight" type="number" step="0.1" min="20" max="400" required></div>
      <div class="field"><label for="goal">Fitness goal</label>
        <select id="goal" name="goal" required>
          <option>Weight loss</option><option>Muscle gain</option><option>General wellness</option><option>Flexibility</option><option>Endurance</option>
        </select></div>
      <div class="field"><label for="intensity">Workout intensity</label>
        <select id="intensity" name="intensity" required>
          <option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option>
        </select></div>
    </div>
    <button type="submit">Generate plan</button>
  </form>
</main></body></html>
